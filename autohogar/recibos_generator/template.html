<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 30pt 42.5pt 20pt 42.5pt;
      color: #000;
      background: #fff;
      font-size: 10.5px;
      width: 595pt;
      box-sizing: border-box;
    }
    .page-container {
      width: 510pt;
      height: 790pt;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      page-break-after: always;
    }
    .page-container:last-child {
      page-break-after: avoid;
    }

    /* SECTION 1 */
    .cuerpo-1 {
      width: 100%;
      margin-bottom: 18pt;
    }
    /* SECTION 2 */
    .cuerpo-2 {
      width: 100%;
      margin-bottom: 18pt;
    }
    /* SECTION 3 */
    .cuerpo-3 {
      width: 100%;
    }

    /* FULL TOP HEADER IMAGE */
    .top-header-banner {
      width: 100%;
      height: 110pt;
      margin-bottom: 2pt;
    }
    .full-header-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ORANGE BANNER */
    .orange-banner {
      background-color: #eb8226;
      color: #fff;
      font-size: 13.5px;
      font-weight: bold;
      padding: 3.5pt 10pt;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6pt;
    }
    .soli-box {
      background-color: #fff;
      color: #000;
      border: 1px solid #eb8226;
      padding: 2px 12px;
      border-radius: 3px;
      font-size: 12.5px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* GRID TABLE */
    .grid-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 4pt;
      margin-bottom: 4pt;
    }
    .grid-box {
      border: 1.5px solid #eb8226;
      border-radius: 5px;
      padding: 4pt 8pt;
      background: #fff;
      vertical-align: top;
    }
    .box-label {
      font-size: 8.5px;
      color: #0099d8;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .box-val {
      font-size: 12.5px;
      font-weight: bold;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 0.2px;
    }

    /* NOTICE SECTION */
    .notice-section {
      font-size: 8.8px;
      color: #000;
      line-height: 1.25;
      margin-top: 4pt;
    }
    .notice-section p {
      margin: 1px 0;
    }

    /* IMPORTE BOX */
    .importe-container {
      display: flex;
      justify-content: flex-end;
      margin-top: 2pt;
    }
    .importe-box {
      border: 1.5px solid #eb8226;
      border-radius: 5px;
      width: 160pt;
      text-align: center;
      overflow: hidden;
    }
    .importe-header {
      background: #fff;
      color: #0099d8;
      font-size: 8.5px;
      font-weight: bold;
      padding: 2px 0;
      border-bottom: 1.5px solid #eb8226;
    }
    .importe-val {
      font-size: 14.5px;
      font-weight: bold;
      padding: 3px 0;
      color: #000;
    }

    .history-line {
      font-size: 8.5px;
      color: #000;
      font-weight: bold;
      margin-top: 4pt;
    }
  </style>
</head>
<body>
  {{BODY_CONTENT}}
</body>
</html>
