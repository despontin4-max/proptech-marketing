<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GESTOR Inmobiliario - Administración de Alquileres</title>
  <!-- Google Fonts: Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo-container">
        <i data-lucide="building-2"></i>
        <span>GESTOR INMO</span>
      </div>
      <nav>
        <ul class="nav-links">
          <li><a href="#" class="nav-item active" data-view="dashboard"><i
                data-lucide="layout-dashboard"></i>Dashboard</a></li>
          <li><a href="#" class="nav-item" data-view="properties"><i data-lucide="home"></i>Propiedades</a></li>
          <li><a href="#" class="nav-item" data-view="tenants"><i data-lucide="users"></i>Inquilinos</a></li>
          <li><a href="#" class="nav-item" data-view="contracts"><i data-lucide="file-text"></i>Contratos</a></li>
          <li><a href="#" class="nav-item" data-view="reports"><i data-lucide="bar-chart-3"></i>Reportes</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-layout">
      <header class="top-bar">
        <div class="search-container">
          <i data-lucide="search" style="position: absolute; left: 12px; top: 10px; width: 18px; color: #9ca3af;"></i>
          <input type="text" class="search-input" placeholder="Buscar propiedades, inquilinos...">
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="btn btn-secondary" id="btnAddProperty"><i data-lucide="plus"></i>Nueva Propiedad</button>
          <div
            style="width: 40px; height: 40px; border-radius: 50%; background: #e5e7eb; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid white; box-shadow: var(--shadow-sm);">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User"
              style="width: 100%; height: 100%;">
          </div>
        </div>
      </header>

      <div id="content" class="content-section">
        <!-- Content injected here via main.js -->
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
