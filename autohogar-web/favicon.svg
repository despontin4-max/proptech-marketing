<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      .bg-badge { fill: #FFFFFF; }
      .bg-border { stroke: #E2E8F0; stroke-width: 2.5; fill: none; }
      .stroke-navy { stroke: #0B192C; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .stroke-orange { stroke: #FF6B00; stroke-width: 5.5; stroke-linecap: round; fill: none; }
      .fill-navy { fill: #0B192C; }
      .fill-orange { fill: #FF6B00; }
    </style>
  </defs>

  <!-- Fondo Blanco con bordes suaves redondeados y marco de contraste -->
  <rect width="100" height="100" rx="20" class="bg-badge" />
  <rect x="1.5" y="1.5" width="97" height="97" rx="18.5" class="bg-border" />

  <!-- Isologo maximizado ocupando todo el contenedor -->
  <g id="isologo-max" transform="translate(-2, 1) scale(1.08)">
    <!-- Arco izquierdo naranja -->
    <path d="M 10 70 A 55 55 0 0 1 50 10 A 50 50 0 0 0 16 65 Z" class="fill-orange" />
    
    <!-- Techo y cumbrera de la casa en azul marino -->
    <polygon points="18,48 50,22 88,54 75,54 50,34 26,54" class="fill-navy" />
    <polygon points="24,44 48,24 48,44" class="fill-navy" />
    
    <!-- Ventanas cuadradas -->
    <rect x="54" y="36" width="7.5" height="7.5" class="fill-navy" rx="1" />
    <rect x="64.5" y="36" width="7.5" height="7.5" class="fill-navy" rx="1" />
    <rect x="54" y="46.5" width="7.5" height="7.5" class="fill-navy" rx="1" />
    <rect x="64.5" y="46.5" width="7.5" height="7.5" class="fill-navy" rx="1" />

    <!-- Silueta del vehículo -->
    <path d="M 22 55 Q 35 48 55 48 Q 72 48 82 56 L 94 58 Q 102 61 98 70" class="stroke-navy" />
    
    <!-- Ruedas y chasis -->
    <path d="M 32 72 A 10 10 0 1 1 52 72" class="stroke-navy" />
    <path d="M 74 72 A 10 10 0 1 1 94 72" class="stroke-navy" />
    <line x1="52" y1="72" x2="74" y2="72" class="stroke-navy" />

    <!-- Trazo base inferior naranja -->
    <path d="M 10 82 Q 55 76 102 82" class="stroke-orange" />
  </g>
</svg>
