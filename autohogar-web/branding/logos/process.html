<!DOCTYPE html>
<html>
<body>
<img id="src" src="logo-autohogar-heater.jpeg">
<canvas id="c"></canvas>
<script>
window.onload = async () => {
  const img = document.getElementById('src');
  const c = document.getElementById('c');
  c.width = img.naturalWidth;
  c.height = img.naturalHeight;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);

  const imgData = ctx.getImageData(0, 0, c.width, c.height);
  const d = imgData.data;
  let minX = c.width, maxX = 0, minY = c.height, maxY = 0;
  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      const idx = (y * c.width + x) * 4;
      if (d[idx] < 245 || d[idx+1] < 245 || d[idx+2] < 245) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }

  const pad = 20;
  const cropW = maxX - minX + 1;
  const cropH = maxY - minY + 1;
  const cOut = document.createElement('canvas');
  cOut.width = cropW + pad * 2;
  cOut.height = cropH + pad * 2;
  const ctxOut = cOut.getContext('2d');
  ctxOut.drawImage(img, minX, minY, cropW, cropH, pad, pad, cropW, cropH);

  const outData = ctxOut.getImageData(0, 0, cOut.width, cOut.height);
  const od = outData.data;
  for (let i = 0; i < od.length; i += 4) {
    const r = od[i], g = od[i+1], b = od[i+2];
    if (r > 246 && g > 246 && b > 246) {
      od[i+3] = 0;
    } else if (r > 210 && g > 210 && b > 210) {
      const avg = (r + g + b) / 3;
      od[i+3] = Math.max(0, 255 - (avg - 210) * 6.5);
    }
  }
  ctxOut.putImageData(outData, 0, 0);

  const dataUrl = cOut.toDataURL('image/png');
  document.body.setAttribute('data-result', dataUrl);
  console.log('PROCESSED_OK');
};
</script>
</body>
</html>
