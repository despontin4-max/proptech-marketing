<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- High contrast dark badge background with subtle border -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#1E293B" stroke-width="3"/>

  <!-- Logo container scaled & centered for maximum visibility in browser tabs -->
  <g transform="translate(14, 16) scale(1.05)" filter="url(#glow)">
    <!-- Orange left arc / swoosh -->
    <path d="M 8 68 A 46 46 0 0 1 42 16 A 40 40 0 0 0 13 64 Z" fill="url(#orangeGrad)" />
    
    <!-- Roof and House elements in vibrant cyan/white -->
    <polygon points="16,46 44,22 78,52 66,52 44,33 24,52" fill="url(#cyanGrad)" />
    <polygon points="22,42 42,24 42,42" fill="#FFFFFF" opacity="0.9" />
    
    <!-- House windows -->
    <rect x="48" y="34" width="6" height="6" fill="#38BDF8" rx="1"/>
    <rect x="56" y="34" width="6" height="6" fill="#38BDF8" rx="1"/>
    <rect x="48" y="42" width="6" height="6" fill="#38BDF8" rx="1"/>
    <rect x="56" y="42" width="6" height="6" fill="#38BDF8" rx="1"/>

    <!-- Car silhouette in crisp cyan -->
    <path d="M 18 52 Q 30 44 48 44 Q 64 44 74 52 L 84 54 Q 92 57 88 65" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Wheels -->
    <circle cx="36" cy="67" r="7" fill="none" stroke="#38BDF8" stroke-width="4" />
    <circle cx="74" cy="67" r="7" fill="none" stroke="#38BDF8" stroke-width="4" />
    <circle cx="36" cy="67" r="2.5" fill="#FFFFFF" />
    <circle cx="74" cy="67" r="2.5" fill="#FFFFFF" />
    
    <!-- Connecting chassis line -->
    <line x1="43" y1="67" x2="67" y2="67" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Dynamic Orange Base Swoosh -->
    <path d="M 6 78 Q 48 71 90 78" fill="none" stroke="url(#orangeGrad)" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
