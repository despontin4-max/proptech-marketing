<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', 'Montserrat', sans-serif">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f2f3" stroke-width="1"/>
    </pattern>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#537179"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#ffffff"/>
  <rect width="900" height="620" fill="url(#grid2)"/>

  <!-- Border Blueprint Frame -->
  <rect x="25" y="25" width="850" height="570" fill="none" stroke="#262626" stroke-width="2"/>
  <rect x="29" y="29" width="842" height="562" fill="none" stroke="#e5e4e4" stroke-width="1"/>

  <!-- Title Block (Aker Architectural Style) -->
  <g transform="translate(45, 45)">
    <rect width="330" height="75" fill="#070707" rx="4"/>
    <text x="18" y="26" fill="#537179" font-size="10" font-weight="700" letter-spacing="2">PLANO TÉCNICO &#8226; LÍNEA TRADICIONAL</text>
    <text x="18" y="48" fill="#ffffff" font-size="17" font-weight="600">Tipología Hogar (2 Dormitorios)</text>
    <text x="18" y="66" fill="#e5e4e4" font-size="11">Cubierta: 48 m² | Cochera/Galería: 25 m² | Total: 73 m²</text>
  </g>

  <!-- Dimension Lines Top & Right -->
  <g stroke="#537179" stroke-width="1.2">
    <!-- Top Width Carport -->
    <line x1="80" y1="95" x2="280" y2="95"/>
    <line x1="80" y1="88" x2="80" y2="102"/>
    <text x="180" y="88" fill="#537179" font-size="11" font-weight="600" text-anchor="middle">COCHERA 3.60 m</text>

    <!-- Top Width House -->
    <line x1="280" y1="95" x2="810" y2="95"/>
    <line x1="280" y1="88" x2="280" y2="102"/>
    <line x1="810" y1="88" x2="810" y2="102"/>
    <text x="545" y="88" fill="#537179" font-size="11" font-weight="600" text-anchor="middle">VIVIENDA 7.80 m (Frente Ampliado)</text>

    <!-- Total Depth -->
    <line x1="835" y1="125" x2="835" y2="515"/>
    <line x1="828" y1="125" x2="842" y2="125"/>
    <line x1="828" y1="515" x2="842" y2="515"/>
    <text x="852" y="320" fill="#537179" font-size="11" font-weight="600" transform="rotate(90, 852, 320)" text-anchor="middle">FONDO 6.20 m</text>
  </g>

  <!-- CARPORT / COCHERA LATERAL (3.60 x 6.20 m = 25 m²) -->
  <g transform="translate(80, 125)">
    <!-- Floor Slab -->
    <rect width="200" height="390" fill="#f8f9f9" stroke="#537179" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- Structural Posts -->
    <rect x="6" y="6" width="14" height="14" fill="#1c1c1c" stroke="#537179" stroke-width="1"/>
    <rect x="6" y="188" width="14" height="14" fill="#1c1c1c" stroke="#537179" stroke-width="1"/>
    <rect x="6" y="370" width="14" height="14" fill="#1c1c1c" stroke="#537179" stroke-width="1"/>
    
    <!-- Vehicle Silhouette (Sedan Familiar) -->
    <g transform="translate(24, 65)" opacity="0.65">
      <rect width="152" height="260" rx="26" fill="#e2e5e7" stroke="#537179" stroke-width="1.5"/>
      <rect x="16" y="52" width="120" height="34" rx="6" fill="#ffffff" stroke="#537179" stroke-width="1"/>
      <rect x="16" y="180" width="120" height="26" rx="4" fill="#ffffff" stroke="#537179" stroke-width="1"/>
      <line x1="28" y1="95" x2="28" y2="170" stroke="#537179" stroke-width="1"/>
      <line x1="124" y1="95" x2="124" y2="170" stroke="#537179" stroke-width="1"/>
      <text x="76" y="132" fill="#537179" font-size="10" font-weight="600" text-anchor="middle">SEDÁN FAMILIAR</text>
    </g>
    <text x="100" y="360" fill="#537179" font-size="10" font-weight="600" text-anchor="middle">COCHERA 25 m² (Techada)</text>
  </g>

  <!-- HOUSE STRUCTURE (7.80 x 6.20 m = 48 m² Cubiertos) -->
  <g transform="translate(280, 125)">
    <!-- House Floor Fill -->
    <rect width="530" height="390" fill="#ffffff"/>

    <!-- Perimeter Exterior Walls (10px = 20cm) -->
    <rect width="530" height="390" fill="none" stroke="#1c1c1c" stroke-width="10"/>

    <!-- INTERIOR WALLS (8px = 12cm) -->
    <!-- Horizontal Wall separating Front (Living/Kitchen) from Rear (Bedrooms/Bath) -->
    <line x1="0" y1="210" x2="530" y2="210" stroke="#1c1c1c" stroke-width="8"/>

    <!-- Vertical Wall separating Living-Dining from Kitchen on the Front -->
    <line x1="330" y1="0" x2="330" y2="150" stroke="#1c1c1c" stroke-width="8"/>

    <!-- Vertical Wall separating Bedroom 1 (Left), Bathroom/Hall (Center), Bedroom 2 (Right) -->
    <line x1="210" y1="210" x2="210" y2="390" stroke="#1c1c1c" stroke-width="8"/>
    <line x1="340" y1="210" x2="340" y2="390" stroke="#1c1c1c" stroke-width="8"/>

    <!-- Bathroom Enclosure inside the center module -->
    <line x1="210" y1="290" x2="340" y2="290" stroke="#1c1c1c" stroke-width="8"/>

    <!-- WINDOW OPENINGS -->
    <!-- Living Window (Front) -->
    <rect x="60" y="-5" width="130" height="10" fill="#ffffff" stroke="#537179" stroke-width="1.5"/>
    <line x1="60" y1="0" x2="190" y2="0" stroke="#537179" stroke-width="2"/>
    <text x="125" y="-10" fill="#537179" font-size="9" text-anchor="middle">V1 (2.00x1.20)</text>

    <!-- Kitchen Window (Front Right) -->
    <rect x="380" y="-5" width="90" height="10" fill="#ffffff" stroke="#537179" stroke-width="1.5"/>
    <line x1="380" y1="0" x2="470" y2="0" stroke="#537179" stroke-width="2"/>
    <text x="425" y="-10" fill="#537179" font-size="9" text-anchor="middle">V2 (1.40x1.10)</text>

    <!-- Bedroom 1 Window (Rear Left) -->
    <rect x="50" y="385" width="100" height="10" fill="#ffffff" stroke="#537179" stroke-width="1.5"/>
    <line x1="50" y1="390" x2="150" y2="390" stroke="#537179" stroke-width="2"/>
    <text x="100" y="408" fill="#537179" font-size="9" text-anchor="middle">V3 (1.50x1.20)</text>

    <!-- Bathroom Ventiluz (Rear Center) -->
    <rect x="250" y="385" width="50" height="10" fill="#ffffff" stroke="#537179" stroke-width="1.5"/>
    <line x1="250" y1="390" x2="300" y2="390" stroke="#537179" stroke-width="2"/>

    <!-- Bedroom 2 Window (Rear Right) -->
    <rect x="390" y="385" width="100" height="10" fill="#ffffff" stroke="#537179" stroke-width="1.5"/>
    <line x1="390" y1="390" x2="490" y2="390" stroke="#537179" stroke-width="2"/>
    <text x="440" y="408" fill="#537179" font-size="9" text-anchor="middle">V4 (1.50x1.20)</text>

    <!-- FURNITURE & FIXTURES -->
    <!-- Living Area (Front Left) -->
    <!-- Sofa 3 bodies + coffee table -->
    <rect x="20" y="40" width="46" height="120" rx="4" fill="#f0f2f3" stroke="#8d8d8d" stroke-width="1"/>
    <rect x="80" y="75" width="45" height="50" rx="2" fill="#fafafa" stroke="#8d8d8d" stroke-width="1"/>
    <!-- Dining Table with 4 Chairs -->
    <rect x="180" y="60" width="100" height="60" rx="4" fill="#fafafa" stroke="#8d8d8d" stroke-width="1.2"/>
    <rect x="195" y="44" width="22" height="12" rx="2" fill="#e5e4e4" stroke="#8d8d8d" stroke-width="1"/>
    <rect x="245" y="44" width="22" height="12" rx="2" fill="#e5e4e4" stroke="#8d8d8d" stroke-width="1"/>
    <rect x="195" y="124" width="22" height="12" rx="2" fill="#e5e4e4" stroke="#8d8d8d" stroke-width="1"/>
    <rect x="245" y="124" width="22" height="12" rx="2" fill="#e5e4e4" stroke="#8d8d8d" stroke-width="1"/>

    <!-- Kitchen Area (Front Right) -->
    <!-- Countertop with sink & cooktop -->
    <rect x="340" y="10" width="180" height="42" fill="#f0f2f3" stroke="#8d8d8d" stroke-width="1"/>
    <rect x="470" y="52" width="50" height="90" fill="#f0f2f3" stroke="#8d8d8d" stroke-width="1"/>
    <!-- Sink -->
    <rect x="370" y="16" width="38" height="24" rx="3" fill="#ffffff" stroke="#537179" stroke-width="1"/>
    <circle cx="389" cy="28" r="3" fill="#537179"/>
    <!-- Cooktop -->
    <rect x="425" y="16" width="34" height="24" rx="2" fill="#e5e4e4" stroke="#1c1c1c" stroke-width="1"/>
    <circle cx="434" cy="24" r="3.5" fill="#1c1c1c"/>
    <circle cx="450" cy="24" r="3.5" fill="#1c1c1c"/>
    <circle cx="434" cy="32" r="3.5" fill="#1c1c1c"/>
    <circle cx="450" cy="32" r="3.5" fill="#1c1c1c"/>
    <!-- Breakfast Bar -->
    <rect x="340" y="138" width="80" height="22" rx="2" fill="#fafafa" stroke="#537179" stroke-width="1"/>

    <!-- BEDROOM 1 (Dormitorio Principal Matrimonial - Rear Left) -->
    <!-- Double Sommier -->
    <rect x="25" y="240" width="120" height="115" rx="4" fill="#fafafa" stroke="#537179" stroke-width="1.5"/>
    <rect x="35" y="246" width="44" height="26" rx="3" fill="#ffffff" stroke="#8d8d8d" stroke-width="1"/>
    <rect x="91" y="246" width="44" height="26" rx="3" fill="#ffffff" stroke="#8d8d8d" stroke-width="1"/>
    <line x1="25" y1="280" x2="145" y2="280" stroke="#537179" stroke-width="1"/>
    <!-- Nightstands -->
    <rect x="150" y="246" width="22" height="24" rx="2" fill="#e5e4e4" stroke="#8d8d8d" stroke-width="1"/>
    <!-- Placard -->
    <rect x="10" y="325" width="190" height="28" fill="#e5e4e4" stroke="#537179" stroke-width="1"/>
    <text x="105" y="343" fill="#537179" font-size="9" text-anchor="middle">PLACARD EMPOTRADO</text>

    <!-- BATHROOM (Rear Center) -->
    <rect x="218" y="325" width="114" height="55" fill="#eef2f3" stroke="#537179" stroke-width="0.8"/>
    <!-- Shower -->
    <rect x="218" y="325" width="48" height="55" fill="#ffffff" stroke="#537179" stroke-width="1"/>
    <line x1="218" y1="325" x2="266" y2="380" stroke="#537179" stroke-width="0.8"/>
    <line x1="266" y1="325" x2="218" y2="380" stroke="#537179" stroke-width="0.8"/>
    <!-- Inodoro & Bidet -->
    <rect x="278" y="340" width="20" height="26" rx="6" fill="#ffffff" stroke="#537179" stroke-width="1"/>
    <rect x="306" y="340" width="20" height="26" rx="6" fill="#ffffff" stroke="#537179" stroke-width="1"/>
    <!-- Vanity Sink -->
    <rect x="235" y="296" width="45" height="24" rx="2" fill="#ffffff" stroke="#537179" stroke-width="1"/>
    <circle cx="257" cy="308" r="6" fill="#f0f2f3" stroke="#537179" stroke-width="1"/>

    <!-- BEDROOM 2 (Dormitorio Secundario - Rear Right, 2 Camas de 1 plaza) -->
    <!-- Bed 1 -->
    <rect x="355" y="235" width="62" height="110" rx="3" fill="#fafafa" stroke="#537179" stroke-width="1.2"/>
    <rect x="363" y="240" width="46" height="22" rx="2" fill="#ffffff" stroke="#8d8d8d" stroke-width="1"/>
    <line x1="355" y1="270" x2="417" y2="270" stroke="#537179" stroke-width="1"/>
    <!-- Bed 2 -->
    <rect x="445" y="235" width="62" height="110" rx="3" fill="#fafafa" stroke="#537179" stroke-width="1.2"/>
    <rect x="453" y="240" width="46" height="22" rx="2" fill="#ffffff" stroke="#8d8d8d" stroke-width="1"/>
    <line x1="445" y1="270" x2="507" y2="270" stroke="#537179" stroke-width="1"/>
    <!-- Center Nightstand -->
    <rect x="422" y="240" width="18" height="22" rx="2" fill="#e5e4e4" stroke="#8d8d8d" stroke-width="1"/>
    <!-- Placard -->
    <rect x="350" y="355" width="165" height="25" fill="#e5e4e4" stroke="#537179" stroke-width="1"/>
    <text x="432" y="371" fill="#537179" font-size="9" text-anchor="middle">PLACARD DORMITORIO 2</text>

    <!-- DOORS & SWING ARCS -->
    <!-- Main Entrance Door (From Carport) -->
    <path d="M 0 140 A 42 42 0 0 1 42 182" fill="none" stroke="#537179" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="140" x2="0" y2="182" stroke="#1c1c1c" stroke-width="3.5"/>

    <!-- Hall Door from Living -->
    <path d="M 230 210 A 36 36 0 0 1 266 246" fill="none" stroke="#537179" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="230" y1="210" x2="266" y2="210" stroke="#1c1c1c" stroke-width="3"/>

    <!-- Bedroom 1 Door -->
    <path d="M 210 240 A 35 35 0 0 1 175 275" fill="none" stroke="#537179" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="210" y1="240" x2="210" y2="275" stroke="#1c1c1c" stroke-width="3"/>

    <!-- Bathroom Door -->
    <path d="M 290 290 A 32 32 0 0 1 322 322" fill="none" stroke="#537179" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="290" y1="290" x2="322" y2="290" stroke="#1c1c1c" stroke-width="3"/>

    <!-- Bedroom 2 Door -->
    <path d="M 340 240 A 35 35 0 0 1 375 275" fill="none" stroke="#537179" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="340" y1="240" x2="340" y2="275" stroke="#1c1c1c" stroke-width="3"/>

    <!-- ROOM LABELS -->
    <g text-anchor="middle">
      <text x="160" y="160" fill="#1c1c1c" font-size="13" font-weight="700">LIVING &#8226; COMEDOR</text>
      <text x="160" y="174" fill="#537179" font-size="11" font-weight="600">16.20 m²</text>

      <text x="430" y="125" fill="#1c1c1c" font-size="13" font-weight="700">COCINA</text>
      <text x="430" y="139" fill="#537179" font-size="11" font-weight="600">6.80 m² (Con Barra)</text>

      <text x="278" y="245" fill="#1c1c1c" font-size="9" font-weight="700">HALL</text>

      <text x="278" y="318" fill="#1c1c1c" font-size="11" font-weight="700">BAÑO</text>
      <text x="278" y="330" fill="#537179" font-size="9" font-weight="600">4.00 m²</text>

      <text x="110" y="225" fill="#1c1c1c" font-size="12" font-weight="700">DORMITORIO 1</text>
      <text x="110" y="238" fill="#537179" font-size="10" font-weight="600">11.50 m² (Matrimonial)</text>

      <text x="435" y="225" fill="#1c1c1c" font-size="12" font-weight="700">DORMITORIO 2</text>
      <text x="435" y="238" fill="#537179" font-size="10" font-weight="600">9.80 m² (2 Camas)</text>
    </g>

    <!-- Main Entrance Arrow -->
    <g transform="translate(-30, 160)">
      <line x1="0" y1="0" x2="22" y2="0" stroke="#537179" stroke-width="3" marker-end="url(#arrow2)"/>
      <text x="-8" y="-6" fill="#537179" font-size="10" font-weight="700">ACCESO</text>
    </g>
  </g>

  <!-- Technical Specs Summary Box (Bottom Right) -->
  <g transform="translate(520, 532)">
    <text x="0" y="14" fill="#262626" font-size="10" font-weight="700">SISTEMA CONSTRUCTIVO:</text>
    <text x="0" y="28" fill="#666666" font-size="10">Industrializado tradicional &#8226; 2 Dormitorios independientes &#8226; 48 m² cubiertos + 25 m² cochera</text>
    <text x="0" y="42" fill="#8d8d8d" font-size="9">* Plano esquemático ilustrativo correspondiente al contrato individual de compraventa Autohogar.</text>
  </g>
</svg>