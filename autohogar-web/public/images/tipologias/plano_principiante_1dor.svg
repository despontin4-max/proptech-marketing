<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', 'Montserrat', sans-serif">
  <defs>
    <pattern id="grid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f2f3" stroke-width="1"/>
    </pattern>
    <marker id="arrow1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#537179"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#ffffff"/>
  <rect width="900" height="620" fill="url(#grid1)"/>

  <!-- Border Blueprint Frame -->
  <rect x="25" y="25" width="850" height="570" fill="none" stroke="#262626" stroke-width="2"/>
  <rect x="29" y="29" width="842" height="562" fill="none" stroke="#e5e4e4" stroke-width="1"/>

  <!-- Title Block (Aker Architectural Style) -->
  <g transform="translate(45, 45)">
    <rect width="330" height="75" fill="#070707" rx="4"/>
    <text x="18" y="26" fill="#537179" font-size="10" font-weight="700" letter-spacing="2">PLANO TÉCNICO &#8226; LÍNEA TRADICIONAL</text>
    <text x="18" y="48" fill="#ffffff" font-size="17" font-weight="600">Tipología Principiante (1 Dormitorio)</text>
    <text x="18" y="66" fill="#e5e4e4" font-size="11">Cubierta: 38 m² | Cochera/Galería: 23 m² | Total: 61 m²</text>
  </g>

  <!-- Dimension Lines Top & Right -->
  <g stroke="#537179" stroke-width="1.2">
    <!-- Top Width Carport -->
    <line x1="120" y1="95" x2="360" y2="95"/>
    <line x1="120" y1="88" x2="120" y2="102"/>
    <text x="240" y="88" fill="#537179" font-size="11" font-weight="600" text-anchor="middle">COCHERA 3.50 m</text>

    <!-- Top Width House -->
    <line x1="360" y1="95" x2="790" y2="95"/>
    <line x1="360" y1="88" x2="360" y2="102"/>
    <line x1="790" y1="88" x2="790" y2="102"/>
    <text x="575" y="88" fill="#537179" font-size="11" font-weight="600" text-anchor="middle">VIVIENDA 6.20 m</text>

    <!-- Total Depth -->
    <line x1="825" y1="125" x2="825" y2="515"/>
    <line x1="818" y1="125" x2="832" y2="125"/>
    <line x1="818" y1="515" x2="832" y2="515"/>
    <text x="842" y="320" fill="#537179" font-size="11" font-weight="600" transform="rotate(90, 842, 320)" text-anchor="middle">FONDO 6.10 m</text>
  </g>

  <!-- CARPORT / COCHERA LATERAL (3.50 x 6.10 m = 23 m²) -->
  <g transform="translate(120, 125)">
    <!-- Floor Slab -->
    <rect width="240" height="390" fill="#f8f9f9" stroke="#537179" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- Structural Posts -->
    <rect x="6" y="6" width="14" height="14" fill="#1c1c1c" stroke="#537179" stroke-width="1"/>
    <rect x="6" y="188" width="14" height="14" fill="#1c1c1c" stroke="#537179" stroke-width="1"/>
    <rect x="6" y="370" width="14" height="14" fill="#1c1c1c" stroke="#537179" stroke-width="1"/>
    
    <!-- Compact Vehicle Silhouette -->
    <g transform="translate(42, 70)" opacity="0.65">
      <rect width="156" height="250" rx="26" fill="#e2e5e7" stroke="#537179" stroke-width="1.5"/>
      <rect x="18" y="50" width="120" height="32" rx="6" fill="#ffffff" stroke="#537179" stroke-width="1"/>
      <rect x="18" y="170" width="120" height="24" rx="4" fill="#ffffff" stroke="#537179" stroke-width="1"/>
      <line x1="30" y1="90" x2="30" y2="160" stroke="#537179" stroke-width="1"/>
      <line x1="126" y1="90" x2="126" y2="160" stroke="#537179" stroke-width="1"/>
      <text x="78" y="125" fill="#537179" font-size="10" font-weight="600" text-anchor="middle">AUTO COMPACTO</text>
    </g>
    <text x="120" y="360" fill="#537179" font-size="11" font-weight="600" text-anchor="middle">GALERÍA / COCHERA 23 m² (Techada)</text>
  </g>

  <!-- HOUSE STRUCTURE (6.20 x 6.10 m = 38 m² Cubiertos) -->
  <g transform="translate(360, 125)">
    <!-- House Floor Fill -->
    <rect width="430" height="390" fill="#ffffff"/>

    <!-- Perimeter Exterior Walls (12px = 20cm) -->
    <rect width="430" height="390" fill="none" stroke="#1c1c1c" stroke-width="10"/>

    <!-- Interior Dividing Walls (8px = 12cm) -->
    <!-- Horizontal Wall separating Living/Dining from Bedroom & Bathroom -->
    <line x1="0" y1="230" x2="430" y2="230" stroke="#1c1c1c" stroke-width="8"/>
    <!-- Vertical Wall separating Bathroom and Bedroom -->
    <line x1="160" y1="230" x2="160" y2="390" stroke="#1c1c1c" stroke-width="8"/>

    <!-- WINDOW OPENINGS -->
    <!-- Front Window (Living-Dining) -->
    <rect x="180" y="-5" width="110" height="10" fill="#ffffff" stroke="#537179" stroke-width="1.5"/>
    <line x1="180" y1="0" x2="290" y2="0" stroke="#537179" stroke-width="2"/>
    <text x="235" y="-10" fill="#537179" font-size="9" text-anchor="middle">V1 (1.80x1.20)</text>

    <!-- Kitchen Window (Left) -->
    <rect x="-5" y="50" width="10" height="70" fill="#ffffff" stroke="#537179" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="0" y2="120" stroke="#537179" stroke-width="2"/>

    <!-- Bedroom Window (Rear) -->
    <rect x="250" y="385" width="100" height="10" fill="#ffffff" stroke="#537179" stroke-width="1.5"/>
    <line x1="250" y1="390" x2="350" y2="390" stroke="#537179" stroke-width="2"/>
    <text x="300" y="408" fill="#537179" font-size="9" text-anchor="middle">V2 (1.50x1.20)</text>

    <!-- Bathroom Window (Ventiluz) -->
    <rect x="50" y="385" width="50" height="10" fill="#ffffff" stroke="#537179" stroke-width="1.5"/>
    <line x1="50" y1="390" x2="100" y2="390" stroke="#537179" stroke-width="2"/>
    <text x="75" y="408" fill="#537179" font-size="9" text-anchor="middle">V3 (0.60x0.40)</text>

    <!-- FURNITURE & FIXTURES -->
    <!-- Kitchen Countertop (L-Shape) -->
    <rect x="10" y="10" width="140" height="40" fill="#f0f2f3" stroke="#8d8d8d" stroke-width="1"/>
    <rect x="10" y="50" width="45" height="90" fill="#f0f2f3" stroke="#8d8d8d" stroke-width="1"/>
    <!-- Sink / Bacha -->
    <rect x="35" y="16" width="36" height="24" rx="3" fill="#ffffff" stroke="#537179" stroke-width="1"/>
    <circle cx="53" cy="28" r="3" fill="#537179"/>
    <!-- Cooktop / Anafe 4 hornallas -->
    <rect x="90" y="16" width="34" height="24" rx="2" fill="#e5e4e4" stroke="#1c1c1c" stroke-width="1"/>
    <circle cx="99" cy="24" r="3.5" fill="#1c1c1c"/>
    <circle cx="115" cy="24" r="3.5" fill="#1c1c1c"/>
    <circle cx="99" cy="32" r="3.5" fill="#1c1c1c"/>
    <circle cx="115" cy="32" r="3.5" fill="#1c1c1c"/>

    <!-- Dining Table with 4 Chairs -->
    <rect x="230" y="50" width="90" height="60" rx="4" fill="#fafafa" stroke="#8d8d8d" stroke-width="1.2"/>
    <!-- Chairs -->
    <rect x="245" y="34" width="22" height="12" rx="2" fill="#e5e4e4" stroke="#8d8d8d" stroke-width="1"/>
    <rect x="285" y="34" width="22" height="12" rx="2" fill="#e5e4e4" stroke="#8d8d8d" stroke-width="1"/>
    <rect x="245" y="114" width="22" height="12" rx="2" fill="#e5e4e4" stroke="#8d8d8d" stroke-width="1"/>
    <rect x="285" y="114" width="22" height="12" rx="2" fill="#e5e4e4" stroke="#8d8d8d" stroke-width="1"/>

    <!-- Living Sofa and Coffee Table -->
    <rect x="280" y="145" width="130" height="42" rx="4" fill="#f0f2f3" stroke="#8d8d8d" stroke-width="1"/>
    <rect x="310" y="194" width="70" height="22" rx="2" fill="#fafafa" stroke="#8d8d8d" stroke-width="1"/>

    <!-- BATHROOM FIXTURES -->
    <!-- Shower Stall -->
    <rect x="10" y="315" width="65" height="65" fill="#eef2f3" stroke="#537179" stroke-width="1"/>
    <line x1="10" y1="315" x2="75" y2="380" stroke="#537179" stroke-width="0.8"/>
    <line x1="75" y1="315" x2="10" y2="380" stroke="#537179" stroke-width="0.8"/>
    <!-- Inodoro & Bidet -->
    <rect x="90" y="340" width="22" height="28" rx="8" fill="#ffffff" stroke="#537179" stroke-width="1"/>
    <rect x="125" y="340" width="22" height="28" rx="8" fill="#ffffff" stroke="#537179" stroke-width="1"/>
    <!-- Vanity Sink -->
    <rect x="100" y="240" width="48" height="30" rx="3" fill="#ffffff" stroke="#537179" stroke-width="1"/>
    <circle cx="124" cy="255" r="7" fill="#f0f2f3" stroke="#537179" stroke-width="1"/>

    <!-- BEDROOM (Dormitorio Matrimonial) -->
    <!-- Double Bed (Sommier 2 plazas) -->
    <rect x="220" y="255" width="130" height="110" rx="4" fill="#fafafa" stroke="#537179" stroke-width="1.5"/>
    <rect x="230" y="260" width="48" height="26" rx="3" fill="#ffffff" stroke="#8d8d8d" stroke-width="1"/>
    <rect x="292" y="260" width="48" height="26" rx="3" fill="#ffffff" stroke="#8d8d8d" stroke-width="1"/>
    <line x1="220" y1="295" x2="350" y2="295" stroke="#537179" stroke-width="1"/>
    <!-- Nightstands -->
    <rect x="185" y="260" width="26" height="26" rx="2" fill="#e5e4e4" stroke="#8d8d8d" stroke-width="1"/>
    <rect x="358" y="260" width="26" height="26" rx="2" fill="#e5e4e4" stroke="#8d8d8d" stroke-width="1"/>
    <!-- Placard Empotrado -->
    <rect x="375" y="310" width="45" height="70" fill="#e5e4e4" stroke="#537179" stroke-width="1"/>
    <line x1="397" y1="310" x2="397" y2="380" stroke="#537179" stroke-width="1"/>
    <text x="397" y="350" fill="#537179" font-size="8" transform="rotate(90, 397, 350)" text-anchor="middle">PLACARD</text>

    <!-- DOORS & SWING ARCS -->
    <!-- Front Door (Entrance from Carport) -->
    <path d="M 0 150 A 42 42 0 0 1 42 192" fill="none" stroke="#537179" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="150" x2="0" y2="192" stroke="#1c1c1c" stroke-width="3.5"/>

    <!-- Bedroom Door -->
    <path d="M 210 230 A 38 38 0 0 1 172 268" fill="none" stroke="#537179" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="210" y1="230" x2="172" y2="230" stroke="#1c1c1c" stroke-width="3"/>

    <!-- Bathroom Door -->
    <path d="M 90 230 A 35 35 0 0 1 55 265" fill="none" stroke="#537179" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="90" y1="230" x2="55" y2="230" stroke="#1c1c1c" stroke-width="3"/>

    <!-- ROOM LABELS -->
    <g text-anchor="middle">
      <text x="210" y="175" fill="#1c1c1c" font-size="13" font-weight="700">COCINA &#8226; COMEDOR &#8226; ESTAR</text>
      <text x="210" y="192" fill="#537179" font-size="11" font-weight="600">22.40 m² (Sup. Útil)</text>

      <text x="80" y="295" fill="#1c1c1c" font-size="12" font-weight="700">BAÑO</text>
      <text x="80" y="308" fill="#537179" font-size="10" font-weight="600">3.80 m²</text>

      <text x="285" y="335" fill="#1c1c1c" font-size="12" font-weight="700">DORMITORIO 1</text>
      <text x="285" y="350" fill="#537179" font-size="10" font-weight="600">11.80 m² (Matrimonial)</text>
    </g>

    <!-- Main Entrance Arrow -->
    <g transform="translate(-32, 170)">
      <line x1="0" y1="0" x2="24" y2="0" stroke="#537179" stroke-width="3" marker-end="url(#arrow1)"/>
      <text x="-8" y="-6" fill="#537179" font-size="10" font-weight="700">ACCESO</text>
    </g>
  </g>

  <!-- Technical Specs Summary Box (Bottom Right) -->
  <g transform="translate(520, 532)">
    <text x="0" y="14" fill="#262626" font-size="10" font-weight="700">SISTEMA CONSTRUCTIVO:</text>
    <text x="0" y="28" fill="#666666" font-size="10">Industrializado tradicional &#8226; Techo chapa negra 2 aguas &#8226; 38 m² cubiertos + 23 m² cochera</text>
    <text x="0" y="42" fill="#8d8d8d" font-size="9">* Plano esquemático ilustrativo correspondiente al contrato individual de compraventa Autohogar.</text>
  </g>
</svg>